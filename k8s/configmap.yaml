apiVersion: v1
kind: ConfigMap
metadata:
  name: ticket-app-config
  namespace: default
data:
  SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/ticketdb
  SPRING_DATASOURCE_USERNAME: root
  SPRING_DATASOURCE_PASSWORD: root
  SPRING_JPA_HIBERNATE_DDL_AUTO: update
  SPRING_JPA_SHOW_SQL: "true"
  SERVER_PORT: "8080"
