apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticket-app
  namespace: ticket-system
  labels:
    app: ticket-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ticket-app
  template:
    metadata:
      labels:
        app: ticket-app
    spec:
      containers:
      - name: ticket-app
        image: docker.io/rahulsng07/ticket-booking:latest
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 20
        resources:
          limits:
            memory: "512Mi"
            cpu: "500m"
